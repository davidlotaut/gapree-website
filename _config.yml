title: Gâprée
tagline: Commune de l'Orne, en Normandie
description: "Site officiel de la commune de Gâprée (Orne) : actualités, talents de la commune et coordonnées de la mairie."
lang: fr
timezone: Europe/Paris

url: "https://gapree.com"
baseurl: ""

markdown: kramdown
future: true

# Phase de développement : noindex global (le site reste accessible sans mot de passe ;
# seul /admin/ est protégé). Passer à false à la mise en ligne définitive.
mode_dev: true

collections:
  actualites:
    output: true
    permalink: /actualites/:name/
  talents:
    output: true
    permalink: /talents/:name/
  elus:
    output: false

defaults:
  - scope:
      path: ""
      type: actualites
    values:
      layout: article
      section: actualites
  - scope:
      path: ""
      type: talents
    values:
      layout: article
      section: talents

exclude:
  - README.md
  - CLAUDE.md
  - serveur
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
