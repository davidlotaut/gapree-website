title: Gâprée
tagline: Commune de l'Orne, en Normandie
description: "Site officiel de la commune de Gâprée (Orne) : actualités, talents de la commune et coordonnées de la mairie."
lang: fr
timezone: Europe/Paris

url: "https://gapree.com"
baseurl: ""

markdown: kramdown
future: true

# true = noindex sur tout le site (phase de construction). Le site est en service
# depuis septembre 2026 : il est ouvert aux moteurs de recherche. Le guide
# d'administration (noindex: true dans son en-tête) et /admin/ restent exclus.
mode_dev: false

collections:
  actualites:
    output: true
    permalink: /actualites/:name/
  talents:
    output: true
    permalink: /talents/:name/
  elus:
    output: false

defaults:
  - scope:
      path: ""
      type: actualites
    values:
      layout: article
      section: actualites
  - scope:
      path: ""
      type: talents
    values:
      layout: article
      section: talents

exclude:
  - README.md
  - CLAUDE.md
  - serveur
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - tests
