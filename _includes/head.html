<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if site.mode_dev or page.noindex %}<meta name="robots" content="noindex">
  {% endif %}{% if site.mode_dev %}<script>if(localStorage.getItem("gapree-acces")==="ok")document.documentElement.classList.add("deverrouille");</script>
  {% endif %}<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ site.data.accueil.photo | absolute_url }}">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='10' fill='%23fff' stroke='%23bf2a1a' stroke-width='6'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='34' font-weight='bold' text-anchor='middle' fill='%231f2b22'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
