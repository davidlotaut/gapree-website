name = "gapree-admin"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Rien de secret ici : le jeton d'écriture GitHub est posé à part,
# par `wrangler secret put JETON_GITHUB`, et n'apparaît dans aucun fichier.
[vars]
DEPOT = "davidlotaut/gapree-website"
BRANCHE = "main"
ORIGINES = "https://davidlotaut.github.io,https://gapree.com,https://www.gapree.com"

# Plafond de tentatives de connexion, compté chez Cloudflare sans rien écrire dans le
# stockage (décision David du 06/10/2026) : 20 par minute et par connexion d'origine.
[[ratelimits]]
name = "LIMITE_CONNEXIONS"
namespace_id = "61390"

  [ratelimits.simple]
  limit = 20
  period = 60

[[kv_namespaces]]
binding = "COMPTES"
id = "f4f34bd179ee47ec920aa02af4d4a46d"

# Journaux conservés : sans eux, un refus de GitHub ne laisse aucune trace
# lisible et il faut deviner ce qui a bloqué.
[observability]
enabled = true
